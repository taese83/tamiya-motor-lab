<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 필수 — safe-area 변수(--mml-safe-top/bottom) 전제 (design-system §5) -->
    <!-- 실기기 피드백: 측정 중 핀치/더블탭 줌이 조작을 방해 — 계기판 앱 특성상 줌 차단.
         (WCAG 1.4.4 트레이드오프 인지 — 개인 도구·수치는 200% text resize로 확대 가능) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- v2.38(사용자: SEO 추가) — 색인 허용 + 파비콘(메뉴 모터 아이콘)·메타·OG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- v2.45(사용자: 홈 화면 추가 아이콘) — PWA manifest(Android·PC 설치) + apple-touch-icon(iOS).
         iOS는 manifest 아이콘·SVG를 홈 화면에 쓰지 않으므로 180×180 PNG를 별도 지정한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Motor Lab" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="미니카(타미야 미니4WD) 모터의 파노(회전수) 측정과 레이스 전압 세팅을 기록·분석하는 모바일 도구"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta
      property="og:description"
      content="미니카 모터 파노 측정 · 레이스 전압 세팅 기록·분석 도구"
    />
    <!-- 웹폰트 미도입(DS-A2: 시스템 폰트 스택) — font preload 힌트 없음 -->
    <!-- 다크 기본 no-flash 부팅 (design-system v2 §7.2) — MUI InitColorSchemeScript는 CSR에서
         실행되지 않으므로 동등 인라인 스크립트를 직접 둔다. 'mml-mode'는 ThemeProvider
         modeStorageKey와 문자열 결속 — 불일치 시 no-flash가 깨진다. -->
    <meta name="theme-color" content="#1A1410" />
    <style>
      html {
        background-color: #0a0a0b;
        /* 더블탭 줌 차단 (iOS는 meta user-scalable을 무시 — touch-action이 실효 수단) */
        touch-action: manipulation;
      }
    </style>
    <script>
      ;(function () {
        // iOS는 meta user-scalable을 무시 — 핀치 제스처를 직접 차단한다 (실기기 피드백)
        document.addEventListener('gesturestart', function (e) { e.preventDefault() }, {passive: false})
        var mode = 'dark'
        try {
          // MUI 7.3의 ThemeProvider defaultMode가 첫 방문에서 light로 초기화되는 것이 관찰됨 —
          // 기본값을 storage에 직접 시드해 MUI가 이 값을 읽게 한다 (다크 기본 계약의 단일 원천).
          // 키 v2('mml-mode-2'): 초기화 버그 시절 기기에 남은 light 값을 무효화 — 전 기기 다크 재시작.
          if (localStorage.getItem('mml-mode-2') === null) localStorage.setItem('mml-mode-2', 'dark')
          if (localStorage.getItem('mml-mode-2') === 'light') mode = 'light'
        } catch (e) {}
        document.documentElement.setAttribute('data-mui-color-scheme', mode)
        if (mode === 'light') document.documentElement.style.backgroundColor = '#FBF6F1'
      })()
    </script>
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
